[workspace]
resolver = "3"
members = ["crates/*", "kb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dbalmain/lab"

[workspace.dependencies]
lab-schema = { path = "crates/lab-schema" }
lab-note = { path = "crates/lab-note" }
lab-lint = { path = "crates/lab-lint" }
anyhow = "1"
jiff = "0.2"
regex = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
